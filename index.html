function openMusicDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window))return reject(new Error('เบราว์เซอร์นี้ไม่รองรับ IndexedDB'));
  let req;
  try{req=indexedDB.open('charmy_music_db',1)}catch(e){return reject(e)}
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('songs'))req.result.createObjectStore('songs')};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('เปิดฐานข้อมูลเพลงไม่ได้'));
  req.onblocked=()=>reject(new Error('ฐานข้อมูลเพลงถูกใช้งานอยู่ กรุณาปิดแท็บอื่น'));
 });
}
async function songTransaction(mode,operation){
 try {
  const database=await openMusicDB();
  return new Promise((resolve,reject)=>{
   let result;
   const tx=database.transaction('songs',mode);
   tx.oncomplete=()=>{database.close();resolve(result)};
   tx.onerror=()=>{const err=tx.error||new Error('ทำรายการไฟล์เพลงไม่สำเร็จ');database.close();reject(err)};
   tx.onabort=()=>{const err=tx.error||new Error('การบันทึกเพลงถูกยกเลิก');database.close();reject(err)};
   try{const req=operation(tx.objectStore('songs'));req.onsuccess=()=>{result=req.result}}catch(e){try{tx.abort()}catch(_){}reject(e)}
  });
 } catch (e) {
  if(mode==='readwrite')throw e;
  return mode==='readonly'?sessionSongBlob:undefined;
 }
}
const saveSongBlob=async(blob)=>{sessionSongBlob=blob;try{await songTransaction('readwrite',store=>store.put(blob,'current_song'));return true}catch(e){return false}};
const getSongBlob=async()=>{try{const b=await songTransaction('readonly',store=>store.get('current_song'));return b||sessionSongBlob}catch(e){return sessionSongBlob}};
const deleteSongBlob=async()=>{sessionSongBlob=null;try{await songTransaction('readwrite',store=>store.delete('current_song'))}catch(e){}};
function musicError(e){
 console.error('Charmy music error:',e);
 if(e?.name==='QuotaExceededError')return 'พื้นที่จัดเก็บเต็ม กรุณาล้างพื้นที่หรือใช้เบราว์เซอร์อื่น';
 if(e?.name==='SecurityError'||e?.name==='InvalidStateError')return 'พื้นที่จัดเก็บถูกจำกัด กรุณาเปิดเว็บไซต์ผ่าน Safari หรือ Chrome โดยตรง';
 return e?.message||'ระบบจัดเก็บเพลงไม่พร้อมใช้งาน';
}

async function ensureSongLoaded(){
 if(globalSongBlob)return true;
 if(musicLoading)return musicLoading;
 musicLoading=(async()=>{
  try{const blob=await getSongBlob();musicLoadError='';if(blob){setMusicBlob(blob);return true}return false}
  catch(e){musicLoadError=musicError(e);return false}
 })();
 try{return await musicLoading}finally{musicLoading=null}
}
function checkMP3(file){
 return new Promise((resolve,reject)=>{
  if(!file||!(/\.mp3$/i.test(file.name)))return reject(new Error('กรุณาเลือกไฟล์ .mp3 เท่านั้น'));
  const url=URL.createObjectURL(file),audio=new Audio();let finished=false;
  const finish=(error,duration)=>{if(finished)return;finished=true;audio.removeAttribute('src');audio.load();URL.revokeObjectURL(url);clearTimeout(timer);error?reject(error):resolve(duration)};
  const timer=setTimeout(()=>finish(new Error('อ่านระยะเวลาเพลงไม่สำเร็จ กรุณาลองไฟล์ MP3 อื่น')),15000);
  audio.onloadedmetadata=()=>{const d=audio.duration;if(Number.isFinite(d)&&d>0){if(d>300)finish(new Error('เพลงต้องยาวไม่เกิน 5 นาที'));else finish(null,d)}};
  audio.ondurationchange=()=>{const d=audio.duration;if(Number.isFinite(d)&&d>0){if(d>300)finish(new Error('เพลงต้องยาวไม่เกิน 5 นาที'));else finish(null,d)}};
  audio.onerror=()=>finish(new Error('ไม่สามารถอ่านไฟล์ MP3 นี้ได้'));
  audio.preload='metadata';audio.src=url;audio.load();
 });
}

function productPrice(p,q){
    q=Math.max(1,Number(q)||1);
    let remainder=q,total=0;
    // Calculate cheapest combination based on available packs
    for(const pack of [...(p.packs||[])].sort((a,b)=>b.qty-a.qty)){
        const n=Number(pack.qty)>0?Math.floor(remainder/Number(pack.qty)):0;
        total+=n*Number(pack.price);
        remainder-=n*Number(pack.qty)
    }
    return total+remainder*Number(p.price);
}
function activeProducts(){return products.filter(p=>!p.isHidden&&dynamicCategories.some(c=>c.name===p.category&&!c.isHidden))}

function updateCardUI(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    let q = shopState.qty[id] || 1;
    // Update numeric input without causing focus loss if user is typing
    const input = document.querySelector(`input[data-qty-id="${id}"]`);
    if (input && document.activeElement !== input) input.value = q;
    
    // Update main total price on button
    $$(`[data-price-id="${id}"]`).forEach(e => e.textContent = '฿' + money(productPrice(p, q)));
    
    // Update pack button active state
    $$(`button[data-action="add-pack-qty"][data-id="${id}"]`).forEach(btn => {
        const pkQty = Number(btn.dataset.qty);
        // Pack is active if it was the last clicked OR if the exact quantity matches the pack amount
        const isMatch = (shopState.lastPackClick?.[id] === pkQty) || (!shopState.lastPackClick?.[id] && q === pkQty);
        btn.classList.toggle('active', isMatch);
    });
}

async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(String(value));else{let t=document.createElement('textarea');t.value=String(value);t.style.position='fixed';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove()}toast('คัดลอกเรียบร้อยแล้ว')}catch(e){msg('ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาเลือกข้อความด้วยตนเอง')}}
function validPromptPay(p){if(!p?.isActive)return false;let n=String(p.number||'').replace(/\D/g,'');return p.type==='id'?/^\d{13}$/.test(n):/^0\d{9}$/.test(n)}
const tlv=(tag,v)=>tag+String(v.length).padStart(2,'0')+v;
function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?(crc<<1)^0x1021:crc<<1}return(crc&65535).toString(16).toUpperCase().padStart(4,'0')}
function generatePP(target,amount,type){const n=String(target).replace(/\D/g,''),id=type==='id'||n.length===13;let m=tlv('00','A000000677010111')+(id?tlv('02',n):tlv('01','0066'+n.slice(1)));let s=tlv('00','01')+tlv('01','12')+tlv('29',m)+tlv('58','TH')+tlv('53','764');if(amount>0)s+=tlv('54',Number(amount).toFixed(2));s+='6304';return s+crc16(s)}
function drawQR(id,value){const c=$(id);if(!c)return;try{if(typeof QRious==='function')new QRious({element:c,size:150,level:'M',value});else{c.getContext('2d').clearRect(0,0,c.width,c.height);toast('ไม่สามารถโหลดระบบสร้าง QR ได้ กรุณาตรวจสอบอินเทอร์เน็ต')}}catch(e){toast('สร้าง QR ไม่สำเร็จ')}}

function renderQueue(){let q=$('queue-search').value.trim().toLowerCase(),found=queues.filter(x=>!x.isHidden&&(!q||String(x.name).toLowerCase().includes(q)||String(x.tag||'').toLowerCase().includes(q)||String(x.number).includes(q)||String(x.orderId||'').toLowerCase().includes(q))).sort((a,b)=>a.number-b.number);$('queue-list').innerHTML=found.length?found.map(x=>{let steps=['รอจัดส่ง','จัดส่งแล้ว'],current=steps.indexOf(x.shippingStatus||'รอจัดส่ง');return `<article class="panel queue-item"><button class="queue-heading" data-action="expand-queue"><span style="display:flex;align-items:center;gap:7px;min-width:0"><span class="pill">No.${esc(String(x.number??x.id).padStart(3,'0'))}</span><span class="tiny break" style="font-weight:600">${esc(x.name)} (${esc(x.tag||'-')})</span></span><span class="pill">${esc(x.shippingStatus||'รอจัดส่ง')} ⌄</span></button><div class="queue-detail hidden"><div class="tiny muted">Order ID: ${esc(x.orderId||'-')} · วันที่: ${esc(x.date||'-')}</div><div class="notice mt10 mb10"><b style="color:var(--cherry)">รายการสินค้า</b>${(x.items||[]).length?(x.items||[]).map(i=>`<div style="display:flex;justify-content:space-between"><span>${esc(i.name)} × ${Number(i.qty)||0}</span><span>฿${money(i.price)}</span></div>`).join(''):`<div>${esc(x.detail||'-')}</div>`}<div style="border-top:1px dashed var(--line);margin-top:6px;padding-top:5px">ยอดรวมสุทธิ <b style="color:var(--cherry)">฿${money(x.total||0)}</b></div></div><div class="queue-timeline">${steps.map((s,i)=>`<div class="queue-step ${i<current?'done':i===current?'active':''}">${s}</div>`).join('')}</div></div></article>`}).join(''):'<div class="empty">ไม่พบคิวงานบริการ</div>';applyCustomTexts()}

function makeSmallImage(f,max=700,quality=.78){return new Promise((resolve,reject)=>{if(!f)return resolve(null);if(!f.type.startsWith('image/'))return reject(Error('กรุณาเลือกรูปภาพ'));const fr=new FileReader();fr.onerror=()=>reject(Error('อ่านไฟล์ไม่ได้'));if(f.type==='image/gif'){if(f.size>900000)return reject(Error('GIF ต้องไม่เกิน 900 KB'));fr.onload=()=>resolve(fr.result);fr.readAsDataURL(f);return}fr.onload=()=>{const image=new Image();image.onerror=()=>reject(Error('เปิดรูปไม่ได้'));image.onload=()=>{const k=Math.min(1,max/Math.max(image.width,image.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.width*k));c.height=Math.max(1,Math.round(image.height*k));c.getContext('2d').drawImage(image,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};image.src=fr.result};fr.readAsDataURL(f)})}

function openProductModal(id){let p=products.find(x=>x.id===id)||null;productImageFile=null;const opts=dynamicCategories.filter(c=>!c.isHidden||c.name===p?.category).map(c=>`<option value="${esc(c.name)}" ${p?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('');showModal(`<div class="modal-title"><h3>${p?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่'}</h3><button class="close-btn" data-action="close-modal">×</button></div><input type="hidden" id="p-id" value="${p?.id||''}"><div class="field"><label>ชื่อสินค้า *</label><input id="p-name" class="control" value="${esc(p?.name||'')}" placeholder="ชื่อสินค้า"></div><div class="field"><label>ภาพสินค้า (URL หรือเลือกจากเครื่อง)</label><img id="p-image-preview" src="${safeUrl(p?.img)}" style="width:62px;height:62px;object-fit:contain;background:var(--light);border:1px solid var(--line);border-radius:12px;margin-bottom:7px" alt="ตัวอย่างภาพ"><input id="p-img" class="control mb10" value="${esc(p?.img?.startsWith('data:')?'':p?.img||'')}" placeholder="https://..."><input type="file" id="p-img-file" accept="image/*" style="font-size:10px;max-width:100%"></div><div class="field"><label>ประเภทสินค้า</label><select id="p-hay" class="control"><option value="true" ${p?.isHayDay!==false?'selected':''}>Hay Day</option><option value="false" ${p?.isHayDay===false?'selected':''}>สินค้า / บริการดิจิทัล</option></select></div><div class="field-row"><div class="field"><label>หมวดหมู่ *</label><select id="p-cat" class="control">${opts}</select></div><div class="field"><label>เลเวล Hay Day</label><input id="p-level" type="number" min="1" class="control" value="${p?.level||1}"></div></div><div class="field-row"><div class="field"><label>ราคา (฿) *</label><input id="p-price" type="number" min="0" step="0.01" class="control" value="${p?.price??0}"></div><div class="field"><label>สต็อก *</label><input id="p-stock" type="number" min="0" class="control" value="${p?.stock??0}"></div></div><div class="admin-toolbar"><b class="label">ราคาแพ็ก (ไม่บัง function saveProduct(){let id=Number($('p-id').value),name=$('p-name').value.trim(),category=$('p-cat').value,price=Number($('p-price').value),stock=Number($('p-stock').value),level=Number($('p-level').value),isHayDay=$('p-hay').value==='true';if(!name||!category||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0||!Number.isInteger(level)||level<1||$('p-price').value===''||$('p-stock').value==='')return toast('กรุณากรอกข้อมูลให้ครบและถูกต้อง');const packs=[];for(const r of $$('#pack-rows .pack-row')){let q=Number(r.querySelector('.pack-qty').value),p=Number(r.querySelector('.pack-price').value);if(!Number.isInteger(q)||q<2||!Number.isFinite(p)||p<0||packs.some(x=>x.qty===q)||!r.querySelector('.pack-price').value)return toast('ข้อมูลราคาแพ็กไม่ถูกต้อง');packs.push({qty:q,price:p})}let old=products.find(x=>x.id===id),img=productImageFile||$('p-img').value.trim()||old?.img||'';if(id&&old)Object.assign(old,{name,category,price,stock,level,isHayDay,packs,img});else products.push({id:uid(),name,category,price,stock,level,isHayDay,packs,img,isHidden:false});save();closeModal();renderAdmin();renderHome();renderShop();toast('บันทึกสินค้าแล้ว')}

function deleteCategory(id){
 const c=dynamicCategories.find(x=>String(x.id)===String(id));if(!c)return;
 const affected=products.filter(p=>p.category===c.name);
 const target=dynamicCategories.find(x=>String(x.id)!==String(id)&&!x.isHidden);
 const detail=affected.length?(target?`สินค้า ${affected.length} รายการจะถูกย้ายไปหมวด ${target.name}`:`สินค้า ${affected.length} รายการในหมวดนี้จะถูกลบด้วย เพราะไม่มีหมวดอื่นให้ย้าย`):'หมวดหมู่นี้ไม่มีสินค้า';
 askDelete(`ลบหมวดหมู่ ${c.name}?`,detail,()=>{
  if(affected.length){if(target)products.forEach(p=>{if(p.category===c.name)p.category=target.name});else{const ids=new Set(affected.map(p=>String(p.id)));products=products.filter(p=>!ids.has(String(p.id)));cart=cart.filter(p=>!ids.has(String(p.id)));}}
  dynamicCategories=dynamicCategories.filter(x=>String(x.id)!==String(id));
  if(!save())return;closeModal();renderAdmin();renderShop();renderHome();updateCartBadge();toast('ลบหมวดหมู่แล้ว');
 });
}

function applyMusicSettings(){
 const a=$('bg-audio');a.volume=Math.max(0,Math.min(1,Number(musicSettings.volume??.5)));
 if(!musicSettings.enabled){a.pause();isAudioPlaying=false;updateMusicIcon(false)}
}
function updateMusicIcon(on){
 const btn=$('music-btn');if(!btn)return;
 btn.style.background=on?'#ffffff65':'';btn.setAttribute('aria-pressed',String(on));
}

function handleFirstInteraction() {
 if (autoPlaySetupDone) return;
 autoPlaySetupDone = true;
 const a = $('bg-audio');
 if (musicSettings.enabled && userMusicPref !== 'off') {
  if (a.paused && songObjectURL) {
   a.play().then(() => { isAudioPlaying = true; updateMusicIcon(true); }).catch(()=>{});
  }
 }
 ['click', 'touchstart', 'scroll'].forEach(evt => document.removeEventListener(evt, handleFirstInteraction));
}

function toggleMusic(){
 const a=$('bg-audio');
 if(!musicSettings.enabled)return toast('ระบบเพลงถูกปิดใช้งานในหลังบ้าน');
 if(!songObjectURL && globalSongBlob) setMusicBlob(globalSongBlob);

 if(songObjectURL){
  if(a.src!==songObjectURL)a.src=songObjectURL;
  if(a.paused){
   localStorage.setItem('charmy_user_music_pref', 'on');
   userMusicPref = 'on';
   a.play().then(()=>{isAudioPlaying=true;updateMusicIcon(true)}).catch(e=>{isAudioPlaying=false;updateMusicIcon(false);toast('เล่นเพลงไม่ได้: '+(e.message||e.name))});
  }else{
   localStorage.setItem('charmy_user_music_pref', 'off');
   userMusicPref = 'off';
   a.pause();isAudioPlaying=false;updateMusicIcon(false);
  }
 }else{
  toast(musicLoadError||'กำลังโหลด หรือยังไม่มีไฟล์เพลง กรุณาเพิ่มเพลงในหลังบ้าน');
 }
}

 }catch(err){toast('เปิดตัวอย่างหน้าแก้ไขไม่ได้: '+err.message)}

frame.srcdoc=`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>${css}\n[data-edit]{outline:1.5px dashed #df84959c;outline-offset:3px;border-radius:3px}[data-edit]:hover{background:#fff0f4;outline:2px solid #b63d52}</style></head><body>${logo}${header}<main class="shell page-main">${section}</main>${footer}${nav}</body></html>`;
}
function openEditorTextInput(id,text){editId=id;$('editor-floating-toolbar')?.remove();let box=document.createElement('div');box.id='editor-floating-toolbar';box.className='editor-floating-toolbar';box.innerHTML=`<div class="label mb10">แก้ไขข้อความบนหน้าเว็บไซต์</div><textarea class="control control-area edit-input" id="editor-inline-input" rows="2" maxlength="250"></textarea><div class="button-row mt10"><button class="btn btn-white" data-action="editor-cancel-text">ยกเลิก</button><button class="btn btn-main" data-action="editor-apply-text">ใช้ข้อความนี้</button></div>`;document.body.appendChild(box);$('editor-inline-input').value=editorDraftTexts[id]??text;requestAnimationFrame(()=>{const input=$('editor-inline-input');if(input){input.readOnly=false;input.removeAttribute('disabled');input.focus({preventScroll:true});input.setSelectionRange(input.value.length,input.value.length)}})}
function applyEditorText(){const value=$('editor-inline-input')?.value;if(value===undefined||!editId)return;editorDraftTexts[editId]=value;const frame=$('editor-iframe');try{frame.contentDocument?.querySelectorAll('[data-edit]').forEach(el=>{if(el.dataset.edit===editId)el.textContent=value})}catch(err){}$('editor-floating-toolbar')?.remove();toast('แก้ข้อความในตัวอย่างแล้ว (อย่าลืมกดบันทึก)')}
function saveVisualEditor(){customTexts={...editorDraftTexts};if(!save())return;closeVisualEditor(true);applySiteSettings();renderHome();renderShop();renderQueue();renderReviews();toast('บันทึกข้อความหน้าเว็บไซต์แล้ว')}

document.addEventListener('click',async e=>{
const el=e.target.closest('[data-action]');if(!el)return;
const a=el.dataset.action,id=Number(el.dataset.id),index=Number(el.dataset.index);
if(el.tagName==='BUTTON')e.preventDefault();

switch(a){
case 'nav':navigate(el.dataset.page);break;
case 'banner-nav':navigate(el.dataset.page);break;
case 'music':toggleMusic();break;
case 'payment':openPaymentModal();break;
case 'cart':toggleCart(true);break;
case 'close-cart':toggleCart(false);break;
case 'checkout':checkout();break;
case 'admin':requireAdmin();break;
case 'close-modal':closeModal();break;
case 'login':login();break;
case 'logout':isAdmin=false;navigate('home');toast('ออกจากระบบแล้ว');break;
case 'slide':goSlide(index);break;
case 'clear-search':$('shop-search').value='';$('shop-level').value='';shopState={...shopState,search:'',filter:'all',level:''};renderShop();break;

// Quantity operations
case 'qty':{
    const p = products.find(x => x.id === id); if(!p) break;
    let current = Math.max(1, Math.min(p.stock, (shopState.qty[id]||1) + Number(el.dataset.delta)));
    shopState.qty[id] = current;
    shopState.lastPackClick = shopState.lastPackClick || {};
    shopState.lastPackClick[id] = null;
    updateCardUI(id);
    break;
}
case 'add-pack-qty':{
    const p = products.find(x => x.id === id); if(!p) break;
    const pkQty = Number(el.dataset.qty);
    let current = shopState.qty[id] || 1;
    shopState.lastPackClick = shopState.lastPackClick || {};
    if (shopState.lastPackClick[id] === pkQty || current === pkQty) current += pkQty; else current = pkQty;
    current = Math.min(current, p.stock);
    shopState.qty[id] = current;
    shopState.lastPackClick[id] = pkQty;
    updateCardUI(id);
    break;
}
case 'add-cart':{
    let q=shopState.qty[id]||1;
    if(addToCart(id,q)){
        shopState.qty[id]=1;
        shopState.checked[id]=false;
        if(shopState.lastPackClick) shopState.lastPackClick[id]=null;
        renderShop();
        renderHome();
    }
    break;
}
case 'add-selected':{
    let ps=filteredProducts().filter(p=>p.stock>0&&shopState.checked[p.id]);
    if(!ps.length)return toast('กรุณาเลือกสินค้า');
    let n=0;
    ps.forEach(p=>{
        if(addToCart(p.id,shopState.qty[p.id]||1,false)){
            shopState.qty[p.id]=1;
            shopState.checked[p.id]=false;
            if(shopState.lastPackClick) shopState.lastPackClick[p.id]=null;
            n++;
        }
    });
    renderShop();renderHome();toast('เพิ่ม '+n+' รายการแล้ว');
    break;
}
case 'cart-qty':{
    let c=cart[index],p=products.find(x=>x.id===c?.id);if(!c||!p)break;
    let next=c.qty+Number(el.dataset.delta);
    if(next>p.stock)return toast('สต็อกไม่พอ');
    if(next<1)cart.splice(index,1);else c.qty=next;
    renderCart();updateCartBadge();
    break;
}
case 'remove-cart':cart.splice(index,1);renderCart();updateCartBadge();break;
case 'copy-order':copyText(currentOrderDetails);break;
case 'copy-bank':copyText(el.dataset.bank);break;
case 'generate-qr':{let pp=paymentSettings.promptpay,amount=Number($('pp-amount').value);if(!validPromptPay(pp))return toast('ยังไม่มีพร้อมเพย์');if(!Number.isFinite(amount)||amount<=0)return toast('กรุณาระบุจำนวนเงิน');$('pp-qr-output').classList.remove('hidden');drawQR('pp-qr-canvas',generatePP(pp.number,amount,pp.type));break}
case 'download-qr':{let c=$('pp-qr-canvas');if(c){let x=document.createElement('a');x.href=c.toDataURL('image/png');x.download='charmy-promptpay.png';x.click()}break}
case 'expand-queue':el.nextElementSibling?.classList.toggle('hidden');break;
case 'review-form':$('review-form').classList.toggle('hidden');break;
case 'hide-review-form':$('review-form').classList.add('hidden');break;
case 'rating':selectedRating=Number(el.dataset.score);renderRatingPicker();break;
case 'submit-review':submitReview();break;
case 'preview-image':showModal(`<div class="modal-title"><h3>รูปภาพ</h3><button class="close-btn" data-action="close-modal">×</button></div><img src="${safeUrl(el.src)}" alt="รูปขยาย" style="width:100%;max-height:70vh;object-fit:contain">`,true);break;
case 'tab':if(el.dataset.tab==='editor')openVisualEditor();else{adminTab=el.dataset.tab;renderAdmin()}break;
case 'open-product':openProductModal(id);break;
case 'add-pack':addPackRow();break;
case 'remove-pack':el.closest('.pack-row')?.remove();break;
case 'save-product':saveProduct();break;
case 'toggle-product':{let p=products.find(x=>x.id===id);if(p){p.isHidden=!p.isHidden;save();renderAdmin();renderShop();renderHome()}break}

// Protected Delete Actions
case 'ask-delete':{
    const targetId = el.dataset.id;
    const type = el.dataset.type;
    const titles = {
        'order': 'ลบคำสั่งซื้อ?', 'queue': 'ลบคิวงาน?', 
        'review': 'ลบรีวิว?', 'banner': 'ลบแบนเนอร์?', 'bank': 'ลบบัญชี?'
    };
    askDelete(titles[type], 'การลบข้อมูลนี้ไม่สามารถกู้คืนได้ ยืนยันใช่หรือไม่?', () => {
        if(type === 'order') orders = orders.filter(x=>String(x.id)!==String(targetId));
        else if(type === 'queue') queues = queues.filter(x=>String(x.id)!==String(targetId));
        else if(type === 'review') reviews = reviews.filter(x=>String(x.id)!==String(targetId));
        else if(type === 'bank') paymentSettings.bankAccounts = paymentSettings.bankAccounts.filter(x=>String(x.id)!==String(targetId));
        else if(type === 'banner') {
            const previous = [...banners];
            banners = banners.filter(x=>String(x.id)!==String(targetId));
            if(!save()) { banners = previous; return; }
            slideIndex=0; renderAdmin(); renderHome(); toast('ลบแล้ว'); return closeModal();
        }
        save(); renderAdmin(); if(type==='queue')renderQueue(); if(type==='review')renderReviews(); 
        toast('ลบแล้ว'); closeModal();
    });
    break;
}
case 'delete-product':{
    let p=products.find(x=>String(x.id)===String(el.dataset.id));
    if(p) askDelete('ลบสินค้า '+p.name+'?','สินค้านี้จะถูกลบออกจากรายการและตะกร้าสินค้า',()=>{
        products=products.filter(x=>String(x.id)!==String(p.id));
        cart=cart.filter(x=>String(x.id)!==String(p.id));
        if(!save())return;
        closeModal();renderAdmin();renderShop();renderHome();updateCartBadge();toast('ลบสินค้าแล้ว')
    });
    break;
}
case 'confirm-delete-custom':{const action=pendingDeleteAction;pendingDeleteAction=null;if(typeof action==='function')action();break}

case 'add-category':addCategory();break;
case 'rename-category':renameCategory(id);break;
case 'toggle-category':{let c=dynamicCategories.find(x=>x.id===id);if(c){c.isHidden=!c.isHidden;save();renderAdmin();renderShop();renderHome()}break}
case 'delete-category':deleteCategory(id);break;
case 'confirm-order':confirmOrder(id);break;
case 'open-queue':openQueueModal(id);break;
case 'save-queue':saveQueue();break;
case 'toggle-queue':{let q=queues.find(x=>x.id===id);if(q){q.isHidden=!q.isHidden;save();renderAdmin();renderQueue()}break}
case 'toggle-review':{let r=reviews.find(x=>x.id===id);if(r){r.isHidden=!r.isHidden;save();renderAdmin();renderReviews();renderHome()}break}
case 'add-banner':await addBanner();break;
case 'toggle-banner':{let b=banners.find(x=>String(x.id)===String(el.dataset.id));if(!b)return toast('ไม่พบแบนเนอร์');let old=b.isHidden;b.isHidden=!old;if(!save()){b.isHidden=old;break}renderAdmin();renderHome();toast(b.isHidden?'ซ่อนแบนเนอร์แล้ว':'แสดงแบนเนอร์แล้ว');break}
case 'save-pp':{let type=$('adm-pp-type').value,num=$('adm-pp-number').value.replace(/\D/g,'');if(type==='phone'&&!/^0\d{9}$/.test(num))return toast('เบอร์ต้องมี 10 หลัก ขึ้นต้นด้วย 0');if(type==='id'&&!/^\d{13}$/.test(num))return toast('เลขบัตรประชาชนต้องมี 13 หลัก');paymentSettings.promptpay={type,number:num,isActive:true};save();toast('บันทึกพร้อมเพย์แล้ว');break}
case 'add-bank':{let bank=$('bank-name').value.trim(),name=$('bank-owner').value.trim(),number=$('bank-number').value.trim(),qrImg=$('bank-image').value.trim();if(!bank||!name||!number)return toast('กรอกข้อมูลบัญชีให้ครบ');paymentSettings.bankAccounts.push({id:uid(),bank,name,number,qrImg,isActive:true,order:paymentSettings.bankAccounts.length+1});save();renderAdmin();break}
case 'toggle-bank':{let b=paymentSettings.bankAccounts.find(x=>x.id===id);if(b){b.isActive=!b.isActive;save();renderAdmin()}break}
case 'save-music-file':{
 const btn=el;btn.disabled=true;
 const v=Number($('adm-music-volume')?.value),enabled=$('adm-music-enabled')?.value==='true';
 const volume=Number.isFinite(v)?Math.min(1,Math.max(0,v)):.5;
 try{
  const f=window.tempSelectedAudioFile;
  if(f){
   const duration=await checkMP3(f);
   const isDbSaved=await saveSongBlob(f);
   const confirmed=await getSongBlob();
   if(!confirmed)throw new Error('เบราว์เซอร์ปิดกั้นระบบพื้นที่จัดเก็บ (Sandbox)');
   setMusicBlob(confirmed);
   musicSettings={enabled:true,fileName:f.name,duration:`${String(Math.floor(duration/60)).padStart(2,'0')}:${String(Math.floor(duration%60)).padStart(2,'0')}`,volume,hasSongSaved:true};
   window.tempSelectedAudioFile=null;window.tempSelectedDuration='';
   musicLoadError=isDbSaved?'':'บันทึกชั่วคราว (เบราว์เซอร์ Sandbox จะลบเพลงออกเมื่อรีเฟรช)';
  }else{musicSettings.enabled=enabled;musicSettings.volume=volume}
  saveMusicPreferences();
  try{localStorage.setItem('charmy_site_v3',JSON.stringify({dynamicCategories,products,queues,orders,reviews,banners,paymentSettings,musicSettings,settings,customTexts}))}catch(e){}
  applyMusicSettings();renderAdminMusic();toast(f?(musicLoadError?'บันทึกเพลงชั่วคราวสำเร็จ':'บันทึกไฟล์ MP3 สำเร็จ'):'บันทึกการตั้งค่าเพลงแล้ว');
 }catch(e){toast('บันทึกเพลงไม่สำเร็จ: '+musicError(e));btn.disabled=false}
 break;
}
case 'remove-music':{
 showModal(`<div class="modal-title"><h3>ยืนยันการลบเพลง</h3><button class="close-btn" data-action="close-modal">×</button></div><p class="tiny muted" style="margin:12px 0 20px">ต้องการลบเพลงที่บันทึกไว้ใช่หรือไม่?</p><div class="button-row"><button class="btn btn-white" data-action="close-modal">ยกเลิก</button><button class="btn btn-danger" data-action="confirm-remove-music">ยืนยันการลบ</button></div>`,true);break;
}
case 'confirm-remove-music':{
 try{
  await deleteSongBlob();setMusicBlob(null);
  musicSettings={enabled:false,fileName:'',duration:'',volume:.5,hasSongSaved:false};
  window.tempSelectedAudioFile=null;window.tempSelectedDuration='';musicLoadError='';
  saveMusicPreferences();try{localStorage.setItem('charmy_site_v3',JSON.stringify({dynamicCategories,products,queues,orders,reviews,banners,paymentSettings,musicSettings,settings,customTexts}))}catch(e){}
  closeModal();renderAdminMusic();toast('ลบเพลงเรียบร้อยแล้ว');
 }catch(e){toast('ลบเพลงไม่สำเร็จ: '+musicError(e))}
 break;
}
case 'test-music':{
 const a=$('bg-audio'),v=Number($('adm-music-volume')?.value);
 if(!a.paused){a.pause();isAudioPlaying=false;updateMusicIcon(false);break}
 if(!songObjectURL){toast(musicLoadError||'ยังไม่มีเพลง กรุณาบันทึกเพลงก่อน');break}
 a.volume=Number.isFinite(v)?Math.min(1,Math.max(0,v)):.5;
 a.play().then(()=>{isAudioPlaying=true;updateMusicIcon(true);toast('กำลังทดลองเล่นเพลง')}).catch(e=>toast('เล่นเพลงไม่ได้: '+(e.message||e.name)));
 break;
}
case 'save-settings':{let name=$('setting-name').value.trim(),tagline=$('setting-tagline').value.trim(),pwd=$('setting-pwd').value;if(!name||!pwd)return toast('กรอกชื่อร้านและรหัสผ่าน');Object.assign(settings,{storeName:name,tagline,headerColor:$('setting-header').value,adminDemoPassword:pwd});delete customTexts.brand_title;delete customTexts.brand_sub;delete customTexts.footer_logo;save();applySiteSettings();toast('บันทึกการตั้งค่าแล้ว');break}
case 'editor-close':closeVisualEditor();break;
case 'editor-save':saveVisualEditor();break;

}
});

document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='shop-search'){shopState.search=e.target.value;renderShop()}
    else if(t.id==='shop-level'){shopState.level=e.target.value;renderShop()}
    else if(t.id==='queue-search'){renderQueue()}
    else if(t.id==='adm-prod-search'){renderAdminProductItems()}
    else if(t.id==='p-img'&&e.target.value.trim()){productImageFile=null;$('p-image-preview').src=safeUrl(e.target.value.trim())}
    else if(t.dataset.action === 'input-qty') {
        const id = Number(t.dataset.qtyId);
        const p = products.find(x => x.id === id);
        if (p) {
            let val = parseInt(t.value, 10);
            shopState.lastPackClick = shopState.lastPackClick || {};
            shopState.lastPackClick[id] = null;
            if (!isNaN(val)) {
                val = Math.min(val, p.stock);
                shopState.qty[id] = val;
                updateCardUI(id);
            }
        }
    }
});

document.addEventListener('change',async e=>{
    const t=e.target;
    if(t.id==='shop-category'){shopState.filter=t.value;t.parentElement.dataset.categoryLabel=t.selectedOptions[0]?.textContent||'ทุกหมวดหมู่';renderShop()}
    else if(t.matches('[data-product-check]')){shopState.checked[t.dataset.productCheck]=t.checked;$$(`[data-product-check="${t.dataset.productCheck}"]`).forEach(x=>x.checked=t.checked);updateSelectedCount()}
    else if(t.id==='select-all'){filteredProducts().filter(p=>p.stock>0).forEach(p=>shopState.checked[p.id]=t.checked);renderShop()}
    else if(t.id==='adm-prod-filter')renderAdminProductItems();
    else if(t.id==='rev-avatar')await previewUpload(t.files[0],'avatar');
    else if(t.id==='rev-image')await previewUpload(t.files[0],'review');
    else if(t.id==='p-img-file'){try{productImageFile=await makeSmallImage(t.files[0],480,.78);$('p-image-preview').src=productImageFile||blankPreview}catch(err){msg(err.message)}}
    else if(t.classList.contains('order-status')){let o=orders.find(x=>x.id===Number(t.dataset.id));if(o){o.status=t.value;save();renderAdmin()}}
    else if(t.classList.contains('shipping-status')){let q=queues.find(x=>x.id===Number(t.dataset.id));if(q){q.shippingStatus=t.value;save();renderQueue();toast('อัปเดตสถานะแล้ว')}}
    else if(t.id==='editor-page-select')showEditorPage(t.value)
    else if(t.dataset.action === 'input-qty') {
        const id = Number(t.dataset.qtyId);
        const p = products.find(x => x.id === id);
        if (p) {
            let val = parseInt(t.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            val = Math.min(val, p.stock);
            shopState.qty[id] = val;
            t.value = val;
            updateCardUI(id);
        }
    }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('editor-floating-toolbar'))$('editor-floating-toolbar').remove();else if($('active-modal'))closeModal();else toggleCart(false)}if(e.key==='Enter'&&e.target.id==='login-password')login()});
$('modal-root').addEventListener('click',e=>{if(e.target.id==='active-modal')closeModal()});
$('bg-audio').addEventListener('error',()=>{isAudioPlaying=false;updateMusicIcon(false)});
$('bg-audio').addEventListener('pause',()=>{isAudioPlaying=false;updateMusicIcon(false)});
$('bg-audio').addEventListener('play',()=>{isAudioPlaying=true;updateMusicIcon(true)});
let touchX=0;$('hero-banner').addEventListener('touchstart',e=>{touchX=e.touches[0]?.clientX||0},{passive:true});$('hero-banner').addEventListener('touchend',e=>{let d=(e.changedTouches[0]?.clientX||0)-touchX,count=banners.filter(x=>!x.isHidden).length;if(count>1&&Math.abs(d)>45)goSlide((slideIndex+(d<0?1:-1)+count)%count)},{passive:true});

(async function initApp(){
  await initMusicSystem();
  applySiteSettings();
  updateCartBadge();
  updateHeaderClock();
  setInterval(updateHeaderClock,1000);
  $('avatar-preview').src=blankPreview;
  $('review-preview').src=blankPreview;
  renderHome();
  renderShop();
  renderQueue();
  renderReviews();
  applyCustomTexts();

  // Auto-play Music System
  if (musicSettings.enabled && userMusicPref !== 'off' && songObjectURL) {
      const a = $('bg-audio');
      a.play().then(() => {
          isAudioPlaying = true; updateMusicIcon(true); autoPlaySetupDone = true;
      }).catch(e => {
          ['click', 'touchstart', 'scroll'].forEach(evt => document.addEventListener(evt, handleFirstInteraction, {once: true, passive: true}));
      });
  } else {
      autoPlaySetupDone = true;
  }
})();
</script>
